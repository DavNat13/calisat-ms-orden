services:
  postgres-db:
    image: postgres:15-alpine
    container_name: calisat-db-orden
    environment:
      POSTGRES_DB: calisat_orden
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - calisat_orden_data:/var/lib/postgresql/data
    networks:
      - calisat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calisat_orden"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Perfil local: activa application-local.yaml (URLs por nombre de servicio).
    command: ["java","-XX:+UseContainerSupport","-XX:MaxRAMPercentage=75.0",
              "-jar","app.jar","--spring.profiles.active=local"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calisat-ms-orden
    ports:
      - "8085:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/calisat_orden
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Broker: cluster de calisat-infra/rabbitmq-cluster (red calisat-net).
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-calisat-rabbit1}
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-calisat-app}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-Calisat2026!}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - calisat-net

networks:
  calisat-net:
    # Nombre fijo: los 7 compose comparten esta misma red para que los
    # microservicios se vean entre si en local (sin IPs, por nombre de servicio).
    name: calisat-net
    driver: bridge

volumes:
  calisat_orden_data:
