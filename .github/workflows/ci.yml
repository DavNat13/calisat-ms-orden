# CI - calisat-ms-orden
# Pipeline básico: compila el microservicio y ejecuta los tests unitarios.
# No se requiere Docker: los tests son unitarios (no usan Testcontainers).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Obtener el código del repositorio
      - uses: actions/checkout@v4
      # Instalar JDK 21 (Temurin) con caché de Maven para acelerar builds
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compilar y ejecutar tests con el wrapper de Maven incluido en el repo
      - name: Compilar y ejecutar tests
        run: ./mvnw -B test
